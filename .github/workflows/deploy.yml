name: Deploy to VPS

on:
  push:
    branches: [main]

# Runs `git pull && npm install && npm run build && pm2 restart` straight on
# the Droplet's working directory -- two of these overlapping (a quick
# second push before the first deploy finishes) race on that same directory
# and can leave a half-written .next build that pm2 then restarts into,
# which is exactly what caused a live 502 on 2026-09-10. Queuing instead of
# canceling: a cancelled mid-script deploy is just as likely to leave a
# half-done state as an overlapping one would.
#
# Same incident, second half of the fix: a build interrupted mid-run leaves
# Next.js's own build lock behind, so the NEXT deploy's `npm run build` then
# fails immediately with "Another next build process is already running" --
# and without `set -e`, that failure was silently ignored and pm2 restarted
# into the stale/broken .next anyway, over and over, on every deploy after.
# `set -e` makes a real build failure stop the script (and fail the Actions
# run visibly) instead of restarting into a broken build.
#
# Third round, same incident: clearing the lock with a bare `rm -rf .next`
# forced a fully-cold Turbopack build with no cache, which then ran past the
# SSH action's 10-minute command_timeout and got killed mid-build. Raised
# command_timeout to 25m so a genuinely slow cold build has room to finish.
#
# Fourth round, same incident: added `pkill -f "next build"` as a defensive
# cleanup step for a leftover build process -- this backfired immediately.
# The whole script is passed to the remote shell as one command line, which
# itself contains the literal substring "next build" (from that very pkill
# line), so `pkill -f` matched the invoking shell's own command line and
# SIGTERM'd the deploy script 2 seconds in, before it did anything. Removed
# -- ssh session teardown already reaps the remote process group when a
# command_timeout closes the connection, so it wasn't needed anyway.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /root/app
            git pull origin main
            npm install
            rm -rf .next
            npm run build
            pm2 restart grony-app
            mkdir -p /var/www/gronymultimedia
            cp -r /root/app/public-site/. /var/www/gronymultimedia/
            chmod -R a+rX /var/www/gronymultimedia
